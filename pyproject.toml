[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vonneuro-messenger"
version = "0.1.0"
description = "Python API for vonNeuro Messenger: run experiments on real neuromorphic hardware"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["neuromorphic", "memristor", "reservoir computing", "lab automation", "hardware"]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://www.vonneuro.com"
Server = "https://series-marina-gigantic.ngrok-free.dev"
Repository = "https://github.com/vonneuro/messenger-api"

[project.scripts]
vonneuro-node = "vonneuro_node.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["vonneuro_messenger", "vonneuro_node"]
